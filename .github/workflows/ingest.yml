name: Ingest

# Temporary daily cadence: 06:17 Asia/Shanghai (22:17 UTC on the prior day).
# Hourly ingestion awaits the network-transfer work in #92.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'

concurrency:
  group: ingest-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Restore the pinned embedding model
        uses: actions/cache@v5
        with:
          path: .cache/transformers
          key: transformers-${{ runner.os }}-bge-small-en-v1.5-ea104dacec62c0de699686887e3f920caeb4f3e3-fp32-v3.8.1
      - run: pnpm install --frozen-lockfile
      - name: Ingest due RSS and Atom Sources into Neon
        run: pnpm exec tsx scripts/pipeline/run.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
