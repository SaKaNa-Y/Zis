# pnpm's settings file, not a workspace definition — there is one `package.json`
# and no `packages:` key here. pnpm 11 moved every setting out of `.npmrc` and
# out of the `pnpm` field in `package.json`, and this is where they live now.

# Which dependencies may run their install scripts. pnpm refuses an install that
# has unreviewed build scripts rather than silently skipping them, so every
# entry is a decision. esbuild's postinstall resolves its platform binary, and
# vitest and tsx are both built on it.
allowBuilds:
  esbuild: true
  # The CPU ONNX runtime is bundled. Its installer only probes for CUDA and may
  # download an unneeded GPU archive, while Zis pins CPU inference explicitly.
  onnxruntime-node: false
  # This postinstall only prints dependency-version advice and changes no
  # runtime artifact.
  protobufjs: false
  # Transformers.js uses sharp only for image pipelines; Signal embeddings are
  # text-only, so its native install check has no role in this application.
  sharp: false

# Both from `@antfu/eslint-config`, which is adopted as-is: cross-platform
# `scripts`, and a registry trust level that may be raised but never lowered.
shellEmulator: true
trustPolicy: no-downgrade

# The one exclusion, and it is reviewed rather than blanket. `undici-types` is
# pinned by `@types/node@22`, which is pinned by the Node 22 runtime; 6.21.0
# ships without provenance where earlier 6.x releases had it, so the policy reads
# it as a downgrade. It is a DefinitelyTyped types-only package with no install
# script and no runtime presence. Excluding the one version keeps the policy on
# for everything else — the alternative, `trustPolicyIgnoreAfter`, would wave
# through every old package at once.
trustPolicyExclude:
  - undici-types@6.21.0

# Temporary security floors for transitive dependencies. Remove each override
# once upstream ranges and the lockfile no longer admit the affected versions.
# GHSA-rgj7-g3m4-5g8c / GHSA-f88m-g3jw-g9cj: Transformers.js still requests 0.34.x.
# GHSA-67mh-4wv8-2f99: drizzle-kit -> @esbuild-kit/core-utils requests 0.18.x;
# reuse drizzle-kit's already-supported 0.25.12 rather than upgrade the toolchain.
# GHSA-2883-xcg3-v3hh: preserve the ESLint dependency's js-yaml 4.x API.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # Additional registry-audit findings: GHSA-q2hr-2g5m-vwhr,
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p. Keep both major APIs.
  brace-expansion@>=1.0.0 <1.1.21: 1.1.21
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  sharp@<0.35.4: 0.35.4
